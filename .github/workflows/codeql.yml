name: "CodeQL"

on:
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            os: ubuntu-latest
            build-mode: manual
          - language: swift
            os: macos-latest
            build-mode: manual
          - language: python
            os: ubuntu-latest
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Android)
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle (Android)
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-root-directory: android

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # Manual build for Android (Kotlin / Java) without cached skips or compiler daemon
      - name: Build Android (Gradle)
        if: matrix.language == 'java-kotlin'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean compileDebugKotlin --no-daemon --no-build-cache --no-configuration-cache -Dkotlin.compiler.execution.strategy=in-process

      # Fast unoptimized Swift build for CodeQL extraction (no LLVM -O or app bundle signing)
      - name: Build macOS (Swift)
        if: matrix.language == 'swift'
        working-directory: macos
        run: |
          xcrun swiftc -Onone glidedrop-daemon.swift -o "${RUNNER_TEMP:-/tmp}/glidedrop-daemon"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
